<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Noukat 😂</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Comic Neue', cursive;
    margin:0;
    min-height:100vh;
    background: linear-gradient(135deg,#ffecd2,#fcb69f);
    display:flex;
    justify-content:center;
    align-items:center;
}
.hidden{display:none;}
.box{
    background:white;
    padding:30px;
    border-radius:25px;
    width:90%;
    max-width:700px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,.2);
}
button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#ff6f61;
    color:white;
    cursor:pointer;
    margin:5px;
}
button:active{transform:translateY(4px);}
#blague{margin-top:20px;font-size:24px;background:#fff3e0;padding:20px;border-radius:20px;}
#classementListe{text-align:left;font-size:20px;}
.top1{color:gold;font-size:26px;}
.top2{color:silver;font-size:23px;}
.top3{color:#cd7f32;font-size:21px;}
.admin-card{border:1px solid #ddd;padding:10px;margin:10px;border-radius:15px;}
.like{background:#ff4081;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="box">
    <h1>😄 Mar7bé bik !</h1>
    <input id="prenomInput" placeholder="Ekteb esmek" style="font-size:20px;padding:10px;border-radius:10px;">
    <br><br>
    <button id="btnEntrer">Entrer</button>
</div>

<!-- JEU -->
<div id="jeu" class="box hidden">
    <h1 id="welcome"></h1>
    <button id="btnBlague">🤣 Enzel</button>
    <button id="btnPrev">⬅️ Elli 9balha</button>
    <button id="btnClassement">🏆 Classement</button>
    <div id="blague"></div>
    <button id="btnLike" class="like">❤️ Like</button>
    <p id="likes"></p>
    <h2 id="score"></h2>

    <hr>
    <h3>💡 Propose ta blague</h3>
    <input id="inputBlague" placeholder="Ekteb blagtik" style="width:80%;padding:10px;border-radius:10px">
    <button id="btnProposer">Envoyer</button>
    <p id="msgBlague" style="color:green;margin-top:10px"></p>

    <hr>
    <button id="btnAdmin">🔐 Admin</button>
</div>

<!-- CLASSEMENT -->
<div id="classement" class="box hidden">
    <h1>🏆 Classement global</h1>
    <div id="classementListe"></div>
    <button id="btnRetour">⬅️ Kammel edh7ak</button>
</div>

<!-- ADMIN -->
<div id="admin" class="box hidden">
    <h2>🛠️ Admin</h2>
    <input id="adminPass" placeholder="Code admin" style="padding:10px;border-radius:10px">
    <br><br>
    <button id="btnAdminLogin">Entrer</button>
    <div id="adminPanel" class="hidden"></div>
</div>

<audio id="rire" src="https://www.myinstants.com/media/sounds/cartoon-laugh.mp3"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDvINeblNfGiH88_1iXQ14ZabFI4ICLlcs",
  authDomain: "noukat-eb290.firebaseapp.com",
  projectId: "noukat-eb290"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ADMIN */
const adminCode = "1234";

/* BLAGUES ORIGINALES */
const blaguesBase = [
"9allek famma wehed mett 💀 w howa ykawerr ⚽️ yekhi tala3 روح رياضية.",
"Famma mgharfa 🥄 mnarvza khtr mehich fi s7anha 🍽️",
"Famma wehd madfoun noss b noss khtr ysawrou fi clip: أنا عايش و مش عايش 😂",
"Famma zouz mchew l mat7af (متحف)، we7ed cheff 9barr maktoub aalih 129 av J.C، 9al l sahbou: chmaaneha 9allou: ya bhim heki série el karhba li dharbetou ⚡",
"Famma wehd mahboul bel PC ki ya7dher l3chée omou t9ollou ALT TAB 😂",
"Famma bagra ta7ett fi bir tala3 kifesh kharjet → mabloula 🐄💦",
"Famma wehd chreb zit yekhi mett, tala3 3le → 9albou zlo9 😭",
"Mra tounsiya fi France 9alet l omha el ghorba morra, 9atlha 3lech? 9alha khater ne9ssa sokker 🍬",
"Famma wehd mche l superette 9alhom 3andkom sokker? 9aloulou ey, 9alhom nchallah lebess 😂",
"Famma ka3ba 9aress wa9fa 9odem el jema3 🕌 3lech? → testanna fel 3assr",
"Famma wehed mche l CUBA yekhi w7el ghadi",
"Famma profett physique 9alet l classa li heya bch t3achihom lila yeki waklethom kaskrout bel molécule",
"Famma mgharfa ta7ett tdharbtt f tawla yekhi 3arrsou",
"Famma najgar 7ab ydallel martou 9allha ye lou7i",
"Famma wehed kle tri7a yekhi walla 0,1 mch wehd",
"Famma kenoun tkasserr yekhi slata bket khtr tchwett aalih",
"famma wehed assla3 mche yokhteb mra, 9al l bouha bentek fou9 rassi yekhi zol9ett",
"Whed r9ad makherr yekhi l9a el 7elma bdet"
];

/* VARIABLES */
let blagues = [...blaguesBase];
let historique = [];
let index = -1;
let score = 0;
let prenom = "";
let currentBlague = "";
let likeCount = 0;

/* ELEMENTS */
const login = document.getElementById("login");
const jeu = document.getElementById("jeu");
const classement = document.getElementById("classement");
const admin = document.getElementById("admin");
const btnEntrer = document.getElementById("btnEntrer");
const btnBlague = document.getElementById("btnBlague");
const btnPrev = document.getElementById("btnPrev");
const btnClassement = document.getElementById("btnClassement");
const btnRetour = document.getElementById("btnRetour");
const btnProposer = document.getElementById("btnProposer");
const inputBlague = document.getElementById("inputBlague");
const msgBlague = document.getElementById("msgBlague");
const btnLike = document.getElementById("btnLike");
const likes = document.getElementById("likes");
const btnAdmin = document.getElementById("btnAdmin");
const btnAdminLogin = document.getElementById("btnAdminLogin");
const adminPass = document.getElementById("adminPass");
const adminPanel = document.getElementById("adminPanel");

/* FONCTIONS */
function updateScore() { document.getElementById("score").textContent = "Score : " + score; }

async function entrer() {
    prenom = document.getElementById("prenomInput").value.trim();
    if(!prenom) return alert("Ekteb esmek");
    localStorage.setItem("prenom", prenom);
    login.classList.add("hidden");
    jeu.classList.remove("hidden");
    document.getElementById("welcome").textContent = "😄 " + prenom;
    updateScore();

    // Charger blagues officielles
    const snap = await getDocs(collection(db,"blaguesOfficielles"));
    snap.forEach(d => blagues.push(d.data().blague));
}

async function nouvelleBlague() {
    if(blagues.length === 0) return;
    const i = Math.floor(Math.random()*blagues.length);
    currentBlague = blagues[i];
    historique.push(currentBlague);
    index = historique.length-1;
    score +=2;
    document.getElementById("blague").textContent = currentBlague;
    document.getElementById("rire").play();
    likes.textContent = "";
    likeCount=0;
    updateScore();
}

function precedente() {
    if(index>0){
        index--;
        document.getElementById("blague").textContent = historique[index];
    }
}

async function proposerBlague() {
    const texte = inputBlague.value.trim();
    if(!texte) return alert("Ekteb blagtik !");
    await addDoc(collection(db,"blaguesProposees"),{
        blague:texte,
        auteur:prenom,
        date:new Date()
    });
    msgBlague.textContent = "✅ Envoyée pour validation";
    inputBlague.value="";
}

async function voirClassement(){
    jeu.classList.add("hidden");
    classement.classList.remove("hidden");
    const snap = await getDocs(collection(db,"noukat"));
    let data=[];
    snap.forEach(d=>data.push(d.data()));
    data.sort((a,b)=>b.score-a.score);
    let html="";
    data.forEach((j,i)=>{
        const c=i===0?"top1":i===1?"top2":i===2?"top3":"";
        html+=`<div class="${c}">${i+1}. ${j.prenom} — ${j.score} pts</div>`;
    });
    document.getElementById("classementListe").innerHTML=html;
}

function retourJeu(){ classement.classList.add("hidden"); jeu.classList.remove("hidden"); }

/* ADMIN */
btnAdmin.onclick=()=>{ admin.classList.remove("hidden"); }
btnAdminLogin.onclick=async ()=>{
    if(adminPass.value!==adminCode) return alert("Code faux");
    adminPanel.classList.remove("hidden");
    adminPanel.innerHTML="";
    const snap = await getDocs(collection(db,"blaguesProposees"));
    snap.forEach(d=>{
        adminPanel.innerHTML+=`
        <div class="admin-card">
        ${d.data().blague}<br>
        <small>${d.data().auteur}</small><br>
        <button onclick="accepter('${d.id}','${d.data().blague}')">✅ Accepter</button>
        <button onclick="refuser('${d.id}')">❌ Refuser</button>
        </div>`;
    });
};

window.accepter=async (id,txt)=>{
    await addDoc(collection(db,"blaguesOfficielles"),{blague:txt});
    await deleteDoc(doc(db,"blaguesProposees",id));
    alert("Ajoutée au jeu");
};
window.refuser=async (id)=>{
    await deleteDoc(doc(db,"blaguesProposees",id));
    alert("Supprimée");
};

/* LIKE */
btnLike.onclick=()=>{ likeCount++; likes.textContent="❤️ "+likeCount; }

/* EVENTS */
btnEntrer.addEventListener("click",entrer);
btnBlague.addEventListener("click",nouvelleBlague);
btnPrev.addEventListener("click",precedente);
btnClassement.addEventListener("click",voirClassement);
btnRetour.addEventListener("click",retourJeu);
btnProposer.addEventListener("click",proposerBlague);

/* AUTO LOGIN */
const prenomStorage = localStorage.getItem("prenom");
if(prenomStorage){ document.getElementById("prenomInput").value=prenomStorage; entrer(); }
</script>
</body>
</html>
